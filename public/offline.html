<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">

    <title>Sin conexión | El Limón</title>
    <style>
      *{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;background:#f7fbf4;color:#182113;font-family:Arial,Helvetica,sans-serif}.card{max-width:420px;padding:32px;border:1px solid #dcebd2;border-radius:18px;background:#fff;box-shadow:0 14px 34px rgba(54,87,21,.08);text-align:center}h1{margin:0;font-size:1.75rem}p{color:#52604b;line-height:1.6}button{min-height:44px;border:0;border-radius:999px;padding:0 20px;background:#507c24;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #365715;outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sin conexión</h1>
      <p>Conéctate a internet para abrir tus formatos. Por privacidad, El Limón no guarda programas privados para uso offline.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
